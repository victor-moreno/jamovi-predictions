---
name: cpLogistic
title: Binary Outcome (Logistic)
menuGroup: Prediction
version: '0.4.1'
jas: '1.2'
weightsSupport: none

description:
    main: >-
        Develop and validate a logistic prediction model for a binary outcome:
        discrimination, calibration, overall performance and clinical utility,
        internal validation by bootstrap or cross-validation, validation in a
        subset of the data or in an external data file, variable importance
        (Shapley R² decomposition, permutation importance, SHAP) and the
        stability of individual predictions.
    R:
        dontrun: false
        usage: |
            data <- MASS::Pima.tr
            cpLogistic(data, dep = "type", covs = c("npreg", "bmi", "ped"),
                       splineVars = "glu", validation = "boot", nBoot = 100)

options:
    - name: data
      type: Data
      description:
          R: the data as a data frame

    - name: dep
      title: Outcome
      type: Variable
      suggested:
        - nominal
      permitted:
        - factor
      description:
          R: a string naming the binary outcome variable

    - name: eventLevel
      title: Event level
      type: String
      default: ''
      description:
          R: >-
              the level of the outcome that is the event; '' (default) uses the
              second level

    - name: covs
      title: Covariates (linear)
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      default: []
      description:
          R: numeric predictors entered as linear terms

    - name: splineVars
      title: Covariates (spline)
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      default: []
      description:
          R: >-
              numeric predictors entered as restricted cubic splines, allowing a
              non-linear association

    - name: factors
      title: Factors
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default: []
      description:
          R: categorical predictors; the first level is the reference

    - name: refLevels
      title: Reference Levels
      type: Array
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: ref
                type: Level
      description:
          R: >-
              a list of lists `list(var = , ref = )` with the reference level of
              each factor (default: the first level)

    - name: covScales
      title: Covariate Scaling
      type: Array
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: scale
                type: List
                options:
                  - name: unit
                    title: per unit
                  - name: sd
                    title: per 1 SD
                  - name: ten
                    title: per 10 units
                  - name: hundred
                    title: per 100 units
                  - name: thousand
                    title: per 1000 units
                default: unit
      description:
          R: >-
              a list of lists `list(var = , scale = )`: the unit of the odds ratio
              of each linear covariate, `'unit'` (default), `'sd'`, `'ten'`,
              `'hundred'` or `'thousand'`; the covariate is divided by it before
              fitting, so predictions do not change

    - name: baseline
      title: Baseline covariates
      type: Array
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: forced
                type: Bool
                default: false
      description:
          R: >-
              a list of lists `list(var = , forced = TRUE)`: the predictors that
              are always in the model (never removed by selection, never
              penalised); they form the baseline model of the incremental-value
              comparison

    - name: selMode
      title: Selection of the other predictors
      type: List
      options:
        - name: none
          title: None (keep every predictor)
        - name: backward
          title: Backward elimination
        - name: forward
          title: Forward selection
        - name: enet
          title: Elastic net (penalised)
      default: none
      description:
          R: >-
              `'none'`, `'backward'`, `'forward'` or `'enet'`: selection of the predictors
              that are not baseline covariates, repeated in every bootstrap or
              cross-validation fit

    - name: selCrit
      title: Criterion
      type: List
      options:
        - name: aic
          title: AIC
        - name: bic
          title: BIC
        - name: lrt
          title: LR test
      default: aic

    - name: selAlpha
      title: α
      type: Number
      min: 0.0001
      max: 0.5
      default: 0.05

    - name: enetAlpha
      title: Mixing (1 = lasso, 0 = ridge)
      type: Number
      min: 0
      max: 1
      default: 0.5
      description:
          R: the elastic net mixing parameter α (1 lasso, 0 ridge)

    - name: enetRule
      title: λ
      type: List
      options:
        - name: min
          title: Minimum CV deviance
        - name: 1se
          title: Largest within 1 SE (sparser)
      default: min

    - name: enetFolds
      title: Folds for λ
      type: Integer
      min: 3
      max: 20
      default: 10

    - name: enetTune
      title: Repeat the λ tuning in each resampled fit
      type: Bool
      default: true
      description:
          R: >-
              in bootstrap and cross-validation fits, choose λ again by
              cross-validation (honest, slower) instead of using the λ of the
              final model

    - name: enetRelax
      title: Refit the selected predictors without penalty (relaxed lasso)
      type: Bool
      default: false
      description:
          R: >-
              the elastic net selects the predictors and an unpenalised model
              refitted on them is the prediction model (repeated in every
              resampled fit); its CIs do not account for the selection

    - name: bootCoefs
      title: Bootstrap inclusion and coefficients
      type: Bool
      default: false
      description:
          R: >-
              with bootstrap validation: inclusion frequency, bootstrap median
              and percentile interval, RMSD ratio and relative conditional bias of
              each coefficient, and the most frequent selected models (Heinze,
              Wallisch & Dunkler 2018)

    - name: incremental
      title: Incremental value over the baseline model
      type: Bool
      default: false
      description:
          R: >-
              compare the baseline model (baseline covariates only) with the
              full model: differences in performance (apparent, optimism-corrected
              and in validation data), LR test of the added predictors,
              reclassification and net benefit

    - name: missExplore
      title: Missing values (exploration)
      type: Bool
      default: false

    - name: missMethod
      title: Missing values
      type: List
      options:
        - name: cc
          title: Complete cases
        - name: category
          title: Missing category / indicator
        - name: single
          title: Single imputation
        - name: mi
          title: Multiple imputation
      default: cc
      description:
          R: >-
              `'cc'` (complete cases), `'category'` (a '(missing)' level for
              factors; for numeric predictors an indicator and the development
              median), `'single'` or `'mi'` (imputation by chained equations with
              predictive mean matching)

    - name: miM
      title: Imputations
      type: Integer
      min: 2
      max: 100
      default: 10

    - name: miIter
      title: Iterations
      type: Integer
      min: 1
      max: 50
      default: 10

    - name: interactions
      title: Interaction terms
      type: Terms
      default: null
      description:
          R: >-
              a list of pairs of predictors, the candidate interaction terms

    - name: intAllPairs
      title: All pairs of predictors as candidates
      type: Bool
      default: false

    - name: intMode
      title: Interactions to keep
      type: List
      options:
        - name: all
          title: All candidates
        - name: aic
          title: Forward selection, AIC
        - name: bic
          title: Forward selection, BIC
        - name: lrt
          title: Forward selection, LR test
      default: all
      description:
          R: >-
              `'all'` keeps every candidate interaction; `'aic'`, `'bic'` or
              `'lrt'` select them forward (repeated within each bootstrap or
              cross-validation fit)

    - name: intAlpha
      title: α to enter
      type: Number
      min: 0.0001
      max: 0.5
      default: 0.05

    - name: knots
      title: Spline knots
      type: Integer
      min: 3
      max: 7
      default: 4
      description:
          R: number of knots of the restricted cubic splines (3 to 7)

    - name: splitVar
      title: Validation split
      type: Variable
      default: null
      suggested:
        - nominal
      permitted:
        - factor
      description:
          R: >-
              a variable that marks the rows used for validation only (e.g. a
              later period or another centre)

    - name: splitLevel
      title: Validation rows
      type: String
      default: ''
      description:
          R: >-
              the level of splitVar that marks validation rows; '' (default) uses
              the second level

    - name: extFile
      title: External validation data
      type: File
      extensions: [csv, tsv, txt, omv, xlsx, sav]
      description:
          R: >-
              a file with the external validation data (csv, tsv, txt, omv, xlsx
              or sav), with the same variable names as the development data

    - name: updating
      title: Model updating (closed testing)
      type: Bool
      default: false
      description:
          R: >-
              in the validation data, compare the original model with
              recalibration in the large, recalibration and model revision,
              and choose among them by the closed testing procedure

    - name: updAlpha
      title: α
      type: Number
      min: 0.0001
      max: 0.5
      default: 0.05

    - name: validation
      title: Internal validation
      type: List
      options:
        - name: none
          title: None (apparent only)
        - name: boot
          title: Bootstrap (optimism correction)
        - name: cv
          title: Cross-validation (k-fold)
      default: none
      description:
          R: >-
              `'none'`, `'boot'` (Harrell's bootstrap optimism correction) or
              `'cv'` (repeated k-fold cross-validation)

    - name: nBoot
      title: Bootstrap samples
      type: Integer
      min: 10
      max: 5000
      default: 200

    - name: nFolds
      title: Folds
      type: Integer
      min: 2
      max: 50
      default: 10

    - name: nRepeats
      title: Repeats
      type: Integer
      min: 1
      max: 100
      default: 5

    - name: seed
      title: Random seed
      type: Integer
      default: 1234

    - name: ciWidth
      title: Confidence level
      type: Number
      min: 50
      max: 99.9
      default: 95

    - name: descTable
      title: Descriptive table
      type: Bool
      default: false

    - name: descStat
      title: Numeric predictors
      type: List
      options:
        - name: meanSD
          title: Mean (SD)
        - name: medianIQR
          title: Median [Q1, Q3]
      default: meanSD

    - name: oddsRatios
      title: Odds ratios
      type: Bool
      default: true

    - name: crude
      title: Crude and adjusted
      type: Bool
      default: true

    - name: predTests
      title: Likelihood ratio tests
      type: Bool
      default: false

    - name: coefs
      title: Model coefficients (β)
      type: Bool
      default: false

    - name: equation
      title: Model equation
      type: Bool
      default: false

    - name: sampleSize
      title: Sample size adequacy (Riley)
      type: Bool
      default: false

    - name: ssSource
      title: Anticipated R²
      type: List
      options:
        - name: model
          title: From this model
        - name: value
          title: Value
      default: model

    - name: ssR2
      title: Cox–Snell R²
      type: Number
      min: 0.001
      max: 0.999
      default: 0.1

    - name: classif
      title: Classification at a threshold
      type: Bool
      default: false

    - name: thrMethod
      title: Threshold
      type: List
      options:
        - name: value
          title: Value
        - name: prevalence
          title: Outcome prevalence
        - name: youden
          title: Youden (data-driven)
      default: value

    - name: threshold
      title: Risk threshold
      type: Number
      min: 0.001
      max: 0.999
      default: 0.5

    - name: dca
      title: Decision curve
      type: Bool
      default: false

    - name: dcaMax
      title: Maximum threshold
      type: Number
      min: 0.02
      max: 0.99
      default: 0.5

    - name: nbThresholds
      title: Net benefit at
      type: String
      default: '0.05, 0.1, 0.2'

    - name: shapley
      title: Shapley R² decomposition
      type: Bool
      default: false

    - name: shapleyMeasure
      title: R² measure
      type: List
      options:
        - name: r2mf
          title: McFadden (deviance)
        - name: r2n
          title: Nagelkerke
      default: r2mf

    - name: permImp
      title: Permutation importance
      type: Bool
      default: false

    - name: nPerm
      title: Permutations
      type: Integer
      min: 1
      max: 1000
      default: 20

    - name: shap
      title: SHAP values
      type: Bool
      default: false

    - name: shapRow
      title: Explain the prediction for row
      type: Integer
      min: 0
      default: 0

    - name: rocPlot
      title: ROC curve
      type: Bool
      default: false

    - name: calPlot
      title: Calibration plot
      type: Bool
      default: false

    - name: calGroups
      title: Risk groups
      type: Integer
      min: 2
      max: 50
      default: 10

    - name: riskPlot
      title: Risk distribution
      type: Bool
      default: false

    - name: stability
      title: Prediction stability (bootstrap)
      type: Bool
      default: false

    - name: explain
      title: Explanations
      type: Bool
      default: false

    - name: exportModel
      title: Export model (JSON)
      type: Action
      action: openExternal
      description:
          R: >-
              writes the fitted model (predictors, coding, spline knots,
              coefficients and, for Cox, the baseline survival at the horizon)
              to a JSON file, which Validate a Published Model reads

    - name: predRisk
      title: Predicted risk
      type: Output

    - name: predLP
      title: Linear predictor
      type: Output
...
