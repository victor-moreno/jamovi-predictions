---
title: Clinical Prediction Models
name: clinpred
version: 0.1.0
jms: '1.0'
authors:
  - V. Moreno
maintainer: V. Moreno <v.moreno@iconcologia.net>
date: '2026-10-07'
type: R
description: >-
  Develop and validate clinical prediction models (TRIPOD+AI): discrimination,
  calibration, net benefit, bootstrap and cross-validation, external validation
  from a data file or a subset of the data, sample size, Shapley and SHAP
  importance, and prediction stability.
analyses:
  - title: Binary Outcome (Logistic)
    name: cpLogistic
    ns: clinpred
    category: analyses
    menuGroup: Prediction
    menuTitle: Binary Outcome (Logistic)
    menuSubtitle: Develop and validate
    description: >-
      Develop and validate a logistic prediction model for a binary outcome:
      discrimination, calibration, overall performance and clinical utility,
      internal validation by bootstrap or cross-validation, validation in a
      subset of the data or in an external data file, variable importance
      (Shapley R² decomposition, permutation importance, SHAP) and the stability
      of individual predictions.
  - title: Continuous Outcome (Linear)
    name: cpLinear
    ns: clinpred
    category: analyses
    menuGroup: Prediction
    menuTitle: Continuous Outcome (Linear)
    menuSubtitle: Develop and validate
    description: >-
      Develop and validate a linear prediction model for a continuous outcome:
      R², RMSE, MAE and calibration, internal validation by bootstrap or
      cross-validation, validation in a subset of the data or in an external
      data file, model updating, variable importance (Shapley R² decomposition,
      permutation importance, SHAP) and the stability of individual predictions.
  - title: Time to Event (Cox)
    name: cpCox
    ns: clinpred
    category: analyses
    menuGroup: Prediction
    menuTitle: Time to Event (Cox)
    menuSubtitle: Develop and validate
    description: >-
      Develop and validate a Cox prediction model for the risk of an event by a
      time horizon: concordance, time-dependent AUC, calibration at the horizon,
      Brier score, Royston's D, net benefit, internal validation by bootstrap or
      cross-validation, validation in a subset of the data or in an external
      data file, variable importance (Shapley R² decomposition, permutation
      importance, SHAP) and the stability of individual predictions.
datasets:
  - name: Pima diabetes (development)
    path: pima_development.omv
    description: >-
      Pima women, Arizona (MASS::Pima.tr): 200 women, diabetes (type) and seven
      clinical predictors. Develop a model here.
  - name: Pima diabetes (development + validation)
    path: pima_split.omv
    description: >-
      Pima.tr and Pima.te stacked (532 women); 'sample' marks the 332 validation
      rows, for the Validation split box.
  - name: Breast cancer, Rotterdam (development)
    path: rotterdam_development.omv
    description: >-
      Node-positive breast cancer, Rotterdam tumour bank (survival::rotterdam):
      1546 women, recurrence-free survival in years (years, rfs) and eight
      predictors. Develop a Cox model here.
  - name: Breast cancer, Rotterdam + GBSG (development + validation)
    path: breast_split.omv
    description: >-
      The Rotterdam women and 686 women of the German Breast Cancer Study Group
      trial (survival::gbsg) stacked; 'cohort' marks the GBSG rows, for the
      Validation split box (Royston & Altman 2013).
usesNative: false
minApp: 28.4.0

...
