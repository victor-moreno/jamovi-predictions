---
title: Binary Outcome (Logistic)
name: cpLogistic
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Outcome
        children:
          - type: VariablesListBox
            name: dep
            maxItemCount: 1
            isTarget: true
            fitToGrid: true
          - type: LevelSelector
            name: eventLevel
            label: Event
            variable: (dep)
            defaultLevelIndex: 1
      - type: TargetLayoutBox
        label: Covariates (linear)
        children:
          - type: VariablesListBox
            name: covs
            isTarget: true
      - type: TargetLayoutBox
        label: Covariates (spline)
        children:
          - type: VariablesListBox
            name: splineVars
            isTarget: true
      - type: TargetLayoutBox
        label: Factors
        children:
          - type: VariablesListBox
            name: factors
            isTarget: true
      - type: TargetLayoutBox
        label: Validation split (optional)
        children:
          - type: VariablesListBox
            name: splitVar
            maxItemCount: 1
            isTarget: true
            fitToGrid: true
          - type: LevelSelector
            name: splitLevel
            label: Validation rows
            variable: (splitVar)
            defaultLevelIndex: 1

  - type: CollapseBox
    label: Model
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: knots
            format: number
          - type: CheckBox
            name: coefs
          - type: CheckBox
            name: equation
          - type: CheckBox
            name: sampleSize
            children:
              - type: ComboBox
                name: ssSource
                enable: (sampleSize)
              - type: TextBox
                name: ssR2
                format: number
                enable: (sampleSize && ssSource:value)

  - type: CollapseBox
    label: Validation
    collapsed: false
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Internal validation
            children:
              - type: ComboBox
                name: validation
              - type: TextBox
                name: nBoot
                format: number
                enable: (validation:boot)
              - type: TextBox
                name: nFolds
                format: number
                enable: (validation:cv)
              - type: TextBox
                name: nRepeats
                format: number
                enable: (validation:cv)
              - type: TextBox
                name: seed
                format: number
              - type: CheckBox
                name: stability
                enable: (validation:boot)
          - type: Label
            label: External validation
            children:
              - type: File
                name: extFile
          - type: TextBox
            name: ciWidth
            label: Confidence interval
            suffix: '%'
            format: number

  - type: CollapseBox
    label: Plots
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: rocPlot
          - type: CheckBox
            name: calPlot
            children:
              - type: TextBox
                name: calGroups
                format: number
                enable: (calPlot)
          - type: CheckBox
            name: riskPlot

  - type: CollapseBox
    label: Clinical Utility
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: classif
            children:
              - type: ComboBox
                name: thrMethod
                enable: (classif)
              - type: TextBox
                name: threshold
                format: number
                enable: (classif && thrMethod:value)
          - type: CheckBox
            name: dca
            children:
              - type: TextBox
                name: dcaMax
                format: number
                enable: (dca)
              - type: TextBox
                name: nbThresholds
                format: string
                enable: (dca)

  - type: CollapseBox
    label: Variable Importance
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: shapley
            children:
              - type: ComboBox
                name: shapleyMeasure
                enable: (shapley)
          - type: CheckBox
            name: permImp
            children:
              - type: TextBox
                name: nPerm
                format: number
                enable: (permImp)
          - type: CheckBox
            name: shap
            children:
              - type: TextBox
                name: shapRow
                format: number
                enable: (shap)

  - type: CollapseBox
    label: Save and Explain
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Save to the data
            children:
              - type: Output
                name: predRisk
              - type: Output
                name: predLP
          - type: CheckBox
            name: explain
