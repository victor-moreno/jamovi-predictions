---
title: Continuous Outcome (Linear)
name: cpLinear
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Outcome
        children:
          - type: VariablesListBox
            name: dep
            maxItemCount: 1
            isTarget: true
            fitToGrid: true
      - type: TargetLayoutBox
        label: Covariates (linear)
        children:
          - type: VariablesListBox
            name: covs
            isTarget: true
      - type: TargetLayoutBox
        label: Covariates (spline)
        children:
          - type: VariablesListBox
            name: splineVars
            isTarget: true
      - type: TargetLayoutBox
        label: Factors
        children:
          - type: VariablesListBox
            name: factors
            isTarget: true
      - type: TargetLayoutBox
        label: Validation split (optional)
        children:
          - type: VariablesListBox
            name: splitVar
            maxItemCount: 1
            isTarget: true
            fitToGrid: true
          - type: LevelSelector
            name: splitLevel
            label: Validation rows
            variable: (splitVar)
            defaultLevelIndex: 1

  - type: CollapseBox
    label: Model
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: knots
            format: number
          - type: CheckBox
            name: descTable
            children:
              - type: ComboBox
                name: descStat
                enable: (descTable)
          - type: CheckBox
            name: oddsRatios
            children:
              - type: CheckBox
                name: crude
                enable: (oddsRatios)
          - type: CheckBox
            name: predTests
          - type: CheckBox
            name: coefs
          - type: CheckBox
            name: equation
          - type: CheckBox
            name: sampleSize
            children:
              - type: ComboBox
                name: ssSource
                enable: (sampleSize)
              - type: TextBox
                name: ssR2
                format: number
                enable: (sampleSize && ssSource:value)

  - type: CollapseBox
    label: Reference Levels
    collapsed: true
    stretchFactor: 1
    children:
      - type: ListBox
        name: refLevels
        showColumnHeaders: true
        fullRowSelect: true
        stretchFactor: 1
        height: large
        columns:
          - name: var
            label: Factor
            selectable: false
            stretchFactor: 1
            maxWidth: 300
            template:
              type: VariableLabel
          - name: ref
            label: Reference Level
            selectable: false
            stretchFactor: 0.5
            template:
              type: LevelSelector
              label: ''

  - type: CollapseBox
    label: Covariate Scaling
    collapsed: true
    stretchFactor: 1
    children:
      - type: ListBox
        name: covScales
        showColumnHeaders: true
        fullRowSelect: true
        stretchFactor: 1
        height: large
        columns:
          - name: var
            label: Covariate
            selectable: false
            stretchFactor: 1
            maxWidth: 300
            template:
              type: VariableLabel
          - name: scale
            label: Effect
            selectable: false
            stretchFactor: 0.5
            template:
              type: ComboBox

  - type: CollapseBox
    label: Variable Selection
    collapsed: true
    stretchFactor: 1
    children:
      - type: ListBox
        name: baseline
        showColumnHeaders: true
        fullRowSelect: true
        stretchFactor: 1
        height: large
        columns:
          - name: var
            label: Predictor
            selectable: false
            stretchFactor: 1
            maxWidth: 300
            template:
              type: VariableLabel
          - name: forced
            label: Baseline (always in)
            selectable: false
            stretchFactor: 0.5
            template:
              type: CheckBox
              label: ''
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: selMode
          - type: ComboBox
            name: selCrit
            enable: (selMode:backward || selMode:forward)
          - type: TextBox
            name: selAlpha
            format: number
            enable: (selCrit:lrt)
          - type: TextBox
            name: enetAlpha
            format: number
            enable: (selMode:enet)
          - type: ComboBox
            name: enetRule
            enable: (selMode:enet)
          - type: TextBox
            name: enetFolds
            format: number
            enable: (selMode:enet)
          - type: CheckBox
            name: enetTune
            enable: (selMode:enet)
          - type: CheckBox
            name: incremental

  - type: CollapseBox
    label: Interactions
    collapsed: true
    stretchFactor: 1
    children:
      - type: Supplier
        name: interactionSupplier
        label: Predictors
        persistentItems: true
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            transferAction: interactions
            label: Candidate interactions
            children:
              - type: ListBox
                name: interactions
                valueFilter: unique
                isTarget: true
                itemDropBehaviour: emptyspace
                template:
                  type: TermLabel
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: intAllPairs
          - type: ComboBox
            name: intMode
          - type: TextBox
            name: intAlpha
            format: number
            enable: (intMode:lrt)

  - type: CollapseBox
    label: Validation
    collapsed: false
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Internal validation
            children:
              - type: ComboBox
                name: validation
              - type: TextBox
                name: nBoot
                format: number
                enable: (validation:boot)
              - type: TextBox
                name: nFolds
                format: number
                enable: (validation:cv)
              - type: TextBox
                name: nRepeats
                format: number
                enable: (validation:cv)
              - type: TextBox
                name: seed
                format: number
              - type: CheckBox
                name: stability
                enable: (validation:boot)
          - type: Label
            label: External validation
            children:
              - type: File
                name: extFile
              - type: CheckBox
                name: updating
                children:
                  - type: TextBox
                    name: updAlpha
                    format: number
                    enable: (updating)
          - type: TextBox
            name: ciWidth
            label: Confidence interval
            suffix: '%'
            format: number

  - type: CollapseBox
    label: Plots
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: calPlot

  - type: CollapseBox
    label: Variable Importance
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: shapley
          - type: CheckBox
            name: permImp
            children:
              - type: TextBox
                name: nPerm
                format: number
                enable: (permImp)
          - type: CheckBox
            name: shap
            children:
              - type: TextBox
                name: shapRow
                format: number
                enable: (shap)

  - type: CollapseBox
    label: Save and Explain
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Save to the data
            children:
              - type: Output
                name: predValue
          - type: CheckBox
            name: explain
          - type: Label
            label: Export
            children:
              - type: ActionButton
                name: exportModel
