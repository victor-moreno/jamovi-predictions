          title: Data set
          type: text
          combineBelow: true
        - name: method
          title: Method
          type: text
        - name: k
          title: Parameters
          type: integer
        - name: a
          title: Intercept
          type: number
        - name: b
          title: Slope
          type: number
        - name: stat
          title: F
          type: number
          superTitle: vs revision
        - name: df
          title: df
          type: integer
          superTitle: vs revision
        - name: p
          title: p
          type: number
          format: zto,pvalue
          superTitle: vs revision
        - name: chosen
          title: Chosen
          type: text
        - name: r2
          title: R²
          type: number
        - name: rmse
          title: RMSE
          type: number

    - name: stabTable
