          type: number
        - name: sd_rmse
          title: SD
          type: number

    - name: shapTable
      title: Importance — Mean |SHAP| (outcome units)
      type: Table
      visible: (shap)
      clearWith: *fit
      columns:
        - name: var
          title: Predictor
          type: text
        - name: meanAbs
          title: Mean |SHAP|
          type: number
        - name: share
          title: '% of total'
          type: number
          format: pc

    - name: plots
      title: Plots
      type: Group
      items:
        - name: calibration
          title: Calibration
          type: Image
          width: 500
          height: 500
          renderFun: .plotCal
          visible: (calPlot)
          clearWith: *modelCI

        - name: shapleyBar
          title: Shapley Decomposition of R²
          type: Image
          width: 550
          height: 350
          renderFun: .plotShapley
          visible: (shapley)
          clearWith: *fitSeed

        - name: permBar
          title: Permutation Importance
          type: Image
          width: 550
          height: 350
          renderFun: .plotPerm
          visible: (permImp)
          clearWith: *perm

        - name: shapSummary
          title: SHAP Summary
          type: Image
          width: 600
          height: 400
          renderFun: .plotShapSummary
          visible: (shap)
          clearWith: *fit

        - name: shapPatient
          title: Explanation of One Prediction
          type: Image
          width: 600
          height: 400
