        - enetTune
        - splitVar
        - splitLevel
        - validation
        - nBoot
        - seed
      columns:
        - name: measure
          title: Measure
          type: text
        - name: value
          title: Value
          type: number

    - name: ssTable
      title: Sample Size Adequacy (Riley et al. 2019)
