---
name:  cpLinear
title: Continuous Outcome (Linear)
jrs:   '1.1'

refs:
    - clinpred
    - steyerberg2019
    - tripodai
    - harrell1996
    - riley2019
    - riley2023
    - debray2015
    - vergouwe2017
    - lmg
    - lundberg2017
    - aas2021

items:
    - name: instructions
      title: Instructions
      type: Html
      visible: true
      clearWith: []

    - name: samples
      title: Data
      type: Table
      clearWith: &model
        - dep
        - covs
        - splineVars
        - factors
        - knots
        - refLevels
        - covScales
        - interactions
        - intAllPairs
        - intMode
        - intAlpha
        - baseline
        - selMode
        - selCrit
        - selAlpha
        - enetAlpha
        - enetRule
        - enetFolds
        - enetTune
        - splitVar
        - splitLevel
        - extFile
      columns:
        - name: set
          title: Data set
          type: text
        - name: n
          title: N
          type: integer
        - name: mean
          title: Mean
          type: number
          superTitle: Outcome
        - name: sd
          title: SD
          type: number
          superTitle: Outcome
        - name: excluded
          title: Excluded (missing)
          type: integer

    - name: extCheck
      title: External Data — Variable Check
      type: Table
      visible: false
      clearWith: *model
      columns:
        - name: var
          title: Variable
          type: text
        - name: role
          title: Role
          type: text
        - name: status
          title: Status
          type: text
        - name: details
          title: Details
          type: text

    - name: caseMix
      title: Case-mix
      type: Table
      visible: false
      clearWith: *model
      columns:
        - name: var
          title: ''
          type: text
          combineBelow: true
        - name: level
          title: ''
          type: text
        - name: dev
          title: Development
          type: text
        - name: split
          title: Validation (rows)
          type: text
          visible: false
        - name: ext
          title: External
          type: text
          visible: false

    - name: descTable
      title: Descriptives (Development Data)
      type: Table
      visible: (descTable)
      clearWith:
        - dep
        - covs
        - splineVars
        - factors
        - splitVar
        - splitLevel
        - descStat
      columns:
        - name: var
          title: ''
          type: text
          combineBelow: true
        - name: level
          title: ''
          type: text
        - name: total
          title: Value
          type: text
        - name: outcome
          title: Outcome
          type: text
        - name: missing
          title: Missing
          type: text

    - name: orTable
      title: Effects on the Outcome
      type: Table
      visible: (oddsRatios)
      clearWith: &fitCI
        - dep
        - covs
        - splineVars
        - factors
        - knots
        - refLevels
        - covScales
        - interactions
        - intAllPairs
        - intMode
        - intAlpha
        - baseline
        - selMode
        - selCrit
        - selAlpha
        - enetAlpha
        - enetRule
        - enetFolds
        - enetTune
        - splitVar
        - splitLevel
        - ciWidth
      columns:
        - name: var
          title: ''
          type: text
          combineBelow: true
        - name: level
          title: ''
          type: text
        - name: or_u
          title: β
          superTitle: Crude
          type: number
          visible: (crude)
        - name: lower_u
          title: Lower
          superTitle: Crude
          type: number
          visible: (crude)
        - name: upper_u
          title: Upper
          superTitle: Crude
          type: number
          visible: (crude)
        - name: p_u
          title: p
          superTitle: Crude
          type: number
          format: zto,pvalue
          visible: (crude)
        - name: or
          title: β
          superTitle: Adjusted
          type: number
        - name: lower
          title: Lower
          superTitle: Adjusted
          type: number
        - name: upper
          title: Upper
          superTitle: Adjusted
          type: number
        - name: p
          title: p
          superTitle: Adjusted
          type: number
          format: zto,pvalue

    - name: testTable
      title: F Tests
      type: Table
      visible: (predTests)
      clearWith: &fit
        - dep
        - covs
        - splineVars
        - factors
        - knots
        - refLevels
        - covScales
        - interactions
        - intAllPairs
        - intMode
        - intAlpha
        - baseline
        - selMode
        - selCrit
        - selAlpha
        - enetAlpha
        - enetRule
        - enetFolds
        - enetTune
        - splitVar
        - splitLevel
      columns:
        - name: term
          title: Term
          type: text
        - name: chisq
          title: F
          type: number
        - name: df
          title: df1
          type: integer
        - name: df2
          title: df2
          type: integer
        - name: p
          title: p
          type: number
          format: zto,pvalue

    - name: intTable
      title: Interactions — Screening and Selection
      type: Table
      visible: false
      clearWith: &fitResample
        - dep
        - covs
        - splineVars
        - factors
        - knots
        - refLevels
        - covScales
        - interactions
        - intAllPairs
        - intMode
        - intAlpha
        - baseline
        - selMode
        - selCrit
        - selAlpha
        - enetAlpha
        - enetRule
        - enetFolds
        - enetTune
        - splitVar
        - splitLevel
        - validation
        - nBoot
        - nFolds
        - nRepeats
        - seed
      columns:
        - name: term
          title: Term
          type: text
        - name: chisq
          title: χ²
          type: number
        - name: df
          title: df
          type: integer
        - name: p
          title: p
          type: number
          format: zto,pvalue
        - name: daic
          title: ΔAIC
          type: number
        - name: dbic
          title: ΔBIC
          type: number
        - name: kept
          title: In model
          type: text
        - name: freq
          title: Resampled fits
          type: number
          format: pc
          visible: false

    - name: selTable
      title: Predictor Selection
      type: Table
      visible: false
      clearWith:
        - dep
        - covs
        - splineVars
        - factors
        - knots
        - refLevels
        - covScales
        - interactions
        - intAllPairs
        - intMode
        - intAlpha
        - baseline
        - selMode
        - selCrit
        - selAlpha
        - enetAlpha
        - enetRule
        - enetFolds
        - enetTune
        - splitVar
        - splitLevel
        - validation
        - nBoot
        - nFolds
        - nRepeats
        - seed
      columns:
        - name: var
          title: Predictor
          type: text
        - name: status
          title: Status
          type: text
        - name: step
          title: Step
          type: integer
        - name: chisq
          title: χ²
          type: number
          superTitle: vs final model
        - name: df
          title: df
          type: integer
          superTitle: vs final model
        - name: p
          title: p
          type: number
          format: zto,pvalue
          superTitle: vs final model
        - name: freq
          title: Resampled fits
          type: number
          format: pc
          visible: false

    - name: subTable
      title: Effects Within Subgroups
      type: Table
      visible: false
      clearWith: *fitCI
      columns:
        - name: effect
          title: Effect
          type: text
          combineBelow: true
        - name: within
          title: Within
          type: text
        - name: or
          title: β
          type: number
        - name: lower
          title: Lower
          type: number
        - name: upper
          title: Upper
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue

    - name: coefTable
      title: Model Coefficients
      type: Table
      visible: (coefs)
      clearWith: *fitCI
      columns:
        - name: term
          title: Predictor
          type: text
        - name: est
          title: β
          type: number
        - name: se
          title: SE
          type: number
        - name: lower
          title: Lower
          type: number
          superTitle: CI
        - name: upper
          title: Upper
          type: number
          superTitle: CI
        - name: p
          title: p
          type: number
          format: zto,pvalue

    - name: equationText
      title: Model Equation
      type: Preformatted
      visible: (equation)
      clearWith: *fit

    - name: perfDev
      title: Performance in the Development Data
      type: Table
      clearWith:
        - dep
        - covs
        - splineVars
        - factors
        - knots
        - refLevels
        - covScales
        - interactions
        - intAllPairs
        - intMode
        - intAlpha
