        - name: group
          title: ''
          type: text
          combineBelow: true
        - name: metric
          title: Measure
          type: text
        - name: apparent
          title: Apparent
          type: number
        - name: lower
          title: Lower
          type: number
          superTitle: CI
        - name: upper
          title: Upper
          type: number
          superTitle: CI
        - name: optimism
          title: Optimism
          type: number
