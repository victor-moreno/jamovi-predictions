        - covs
        - splineVars
        - factors
        - knots
        - refLevels
        - covScales
        - interactions
        - intAllPairs
        - intMode
        - intAlpha
        - baseline
        - selMode
        - selCrit
        - selAlpha
        - enetAlpha
        - enetRule
        - enetFolds
        - enetTune
        - splitVar
        - splitLevel
        - extFile
        - updAlpha
